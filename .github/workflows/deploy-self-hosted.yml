name: Auto Deploy

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: oneberry-vms

    steps:
      - name: Update Source
        run: |
          cd ~/Documents/oneberry-vms
          git fetch origin
          git reset --hard origin/development
          git clean -fd

      - name: Build Web UI
        run: |
          cd ~/Documents/oneberry-vms
          bash scripts/build_web_vite.sh

      - name: Prep Dependencies (llhttp)
        run: |
          cd ~/Documents/oneberry-vms
          mkdir -p external/llhttp
          tar -xzf llhttp.tar.gz -C external/llhttp --strip-components=1

      - name: Build Backend
        run: |
          cd ~/Documents/oneberry-vms
          bash scripts/build.sh --release

      - name: Install and Restart Service
        run: |
          cd ~/Documents/oneberry-vms
          sudo bash scripts/install.sh
          sudo systemctl restart lightnvr
          sudo systemctl status lightnvr --no-pager
